<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Illustrative AppReview Radar workflow: collect public Android and iOS reviews, filter and inspect topic evidence, export a feedback shortlist.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07161D"/><stop offset="1" stop-color="#102D37"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#83F4D9"/><stop offset="1" stop-color="#35C5A7"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17343E"/><stop offset="1" stop-color="#102731"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="80" r="410" fill="none" stroke="#244C55" stroke-width="1" opacity=".5"/>
  <circle cx="1450" cy="80" r="310" fill="none" stroke="#244C55" stroke-width="1" opacity=".5"/>
  <circle cx="1450" cy="80" r="210" fill="none" stroke="#244C55" stroke-width="1" opacity=".5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="84" y="64" width="51" height="51" rx="13" fill="url(#mint)"/>
    <path d="M97 79h25v19h-11l-9 7v-7h-5Z" fill="#12313B"/>
    <text x="153" y="101" fill="#E9F5F2" font-size="29" font-weight="700">AppReview Radar</text>
    <rect x="1200" y="71" width="316" height="39" rx="19" fill="#1D3F47"/>
    <text x="1358" y="97" text-anchor="middle" fill="#B2D8D0" font-size="18">ANDROID + iOS · ONE WORKFLOW</text>
    <text x="84" y="214" fill="#F3FAF8" font-size="62" font-weight="700">Find the feedback</text>
    <text x="84" y="286" fill="#80EDD2" font-size="62" font-weight="700">worth reading next.</text>
    <text x="86" y="342" fill="#BAD0D1" font-size="25">Public app reviews → transparent filters → a usable shortlist</text>
    <g>
      <rect x="84" y="403" width="432" height="288" rx="24" fill="url(#panel)" stroke="#34525B"/>
      <rect x="108" y="428" width="49" height="38" rx="10" fill="#264852"/>
      <text x="132" y="454" text-anchor="middle" fill="#91EAD4" font-size="20" font-weight="700">01</text>
      <text x="108" y="514" fill="#F0F8F6" font-size="29" font-weight="700">Choose your apps</text>
      <text x="108" y="554" fill="#B8CED0" font-size="21">Google Play + App Store</text>
      <rect x="108" y="581" width="174" height="43" rx="11" fill="#25434C"/>
      <text x="195" y="609" text-anchor="middle" fill="#D5E6E3" font-size="18">App ID or store URL</text>
      <text x="108" y="658" fill="#93B1B5" font-size="18">Start small. Keep source limits visible.</text>
    </g>
    <path d="m530 545h30m-10-10 10 10-10 10" fill="none" stroke="#75DCC3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="584" y="403" width="432" height="288" rx="24" fill="url(#panel)" stroke="#34525B"/>
      <rect x="608" y="428" width="49" height="38" rx="10" fill="#264852"/>
      <text x="632" y="454" text-anchor="middle" fill="#91EAD4" font-size="20" font-weight="700">02</text>
      <text x="608" y="514" fill="#F0F8F6" font-size="29" font-weight="700">Focus the question</text>
      <text x="608" y="554" fill="#B8CED0" font-size="21">Stars · dates · words · topic matches</text>
      <rect x="608" y="581" width="95" height="43" rx="11" fill="#25434C"/>
      <text x="655" y="609" text-anchor="middle" fill="#D5E6E3" font-size="18">Login</text>
      <rect x="716" y="581" width="95" height="43" rx="11" fill="#25434C"/>
      <text x="763" y="609" text-anchor="middle" fill="#D5E6E3" font-size="18">Billing</text>
      <rect x="824" y="581" width="159" height="43" rx="11" fill="#25434C"/>
      <text x="903" y="609" text-anchor="middle" fill="#D5E6E3" font-size="18">Feature requests</text>
      <text x="608" y="658" fill="#93B1B5" font-size="18">Rule matches with source evidence.</text>
    </g>
    <path d="m1030 545h30m-10-10 10 10-10 10" fill="none" stroke="#75DCC3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="1084" y="403" width="432" height="288" rx="24" fill="url(#panel)" stroke="#55B39E"/>
      <rect x="1108" y="428" width="49" height="38" rx="10" fill="#315D5B"/>
      <text x="1132" y="454" text-anchor="middle" fill="#AEF4DE" font-size="20" font-weight="700">03</text>
      <text x="1108" y="514" fill="#F0F8F6" font-size="29" font-weight="700">Use the shortlist</text>
      <text x="1108" y="554" fill="#B8CED0" font-size="21">CSV + Markdown feedback report</text>
      <rect x="1108" y="581" width="170" height="43" rx="11" fill="#25434C"/>
      <text x="1193" y="609" text-anchor="middle" fill="#D5E6E3" font-size="18">Read original excerpts</text>
      <text x="1108" y="658" fill="#93B1B5" font-size="18">Pass saved keys to skip old reviews.</text>
    </g>
    <rect x="84" y="738" width="1432" height="67" rx="17" fill="#193C43"/>
    <text x="112" y="780" fill="#B5E9DA" font-size="22">No LLM key needed</text>
    <circle cx="362" cy="772" r="3" fill="#69998F"/>
    <text x="389" y="780" fill="#B5E9DA" font-size="22">Only saved matches generate review events</text>
    <circle cx="950" cy="772" r="3" fill="#69998F"/>
    <text x="977" y="780" fill="#B5E9DA" font-size="22">Inspect evidence before deciding</text>
    <text x="84" y="850" fill="#8CAFB2" font-size="18">Illustrative workflow · limited source windows · topic tags are keyword rules, not verified findings</text>
  </g>
</svg>
